# Build and publish Atrium installers for Windows, macOS, and Linux.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1 / M2 / M3 / M4)
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          # Intel Mac
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libasound2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Do not set TAURI_SIGNING_PRIVATE_KEY_PASSWORD unless the key has one.
          # A blank password secret breaks signing ("Missing comment in secret key").
        with:
          tagName: v__VERSION__
          releaseName: Atrium v__VERSION__
          releaseBody: |
            ## Download (pick one)

            | Your computer | File to download |
            | --- | --- |
            | **Windows** | `Atrium_*_x64-setup.exe` |
            | **Mac with Apple chip** (M1 / M2 / M3 / M4) | `Atrium_*_aarch64.dmg` |
            | **Mac with Intel chip** | `Atrium_*_x64.dmg` |
            | **Linux** | `Atrium_*_amd64.AppImage` |

            macOS tip: first open may need right-click → **Open**.
            Windows tip: SmartScreen may warn until code signing is added.

            Ignore `.sig`, `.app.tar.gz`, and `latest.json` — those are only for in-app updates.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
